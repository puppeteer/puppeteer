name: Docs

# Declare default permissions as read only.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      base:
        description: Git revision to compare against.
        required: false
        type: string
      deploy:
        description: Whether to deploy the built website.
        default: false
        required: false
        type: boolean
      ref:
        description: Git revision to build.
        required: false
        type: string
    secrets:
      ALGOLIA_CRAWLER_API_KEY:
        required: false
      ALGOLIA_CRAWLER_ID:
        required: false
      ALGOLIA_CRAWLER_USER_ID:
        required: false
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - '**'

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  check-changes:
    uses: ./.github/workflows/changed-packages.yml
    with:
      base: ${{ inputs.base }}
      check-mergeable-state: true
      ref: ${{ inputs.ref }}

  build-docs:
    needs: check-changes
    name: Build docs (if needed)
    if: ${{ needs.check-changes.result == 'success' && contains(fromJSON(needs.check-changes.outputs.changes), 'website') }}
    runs-on: ubuntu-latest
    # The build compiles content derived from pull request metadata (e.g. the
    # changelog), so it must never have write access to the repository.
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: '.nvmrc'
      - name: Install dependencies
        working-directory: ./website
        run: npm ci
      - name: Build website
        working-directory: ./website
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
      - name: Check for tracked changes
        run: git diff --exit-code
      - name: Upload website
        if: ${{ inputs.deploy }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website
          path: ./website/build
          if-no-files-found: error
          retention-days: 1

  deploy-docs:
    needs: build-docs
    name: Deploy docs
    if: ${{ inputs.deploy && needs.build-docs.result == 'success' }}
    runs-on: ubuntu-latest
    # Only this job gets write access. It must not check out or execute any
    # repository code.
    permissions:
      contents: write
    steps:
      - name: Download website
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website
          path: ./website/build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          user_name: release-please[bot]
          user_email: 55107282+release-please[bot]@users.noreply.github.com
      - name: Test Algolia if Crawler is blocked
        # Only check the crawler after a deployment.
        if: ${{ inputs.deploy }}
        env:
          CRAWLER_USER_ID: ${{secrets.ALGOLIA_CRAWLER_USER_ID}}
          CRAWLER_API_KEY: ${{secrets.ALGOLIA_CRAWLER_API_KEY}}
          CRAWLER_ID: ${{secrets.ALGOLIA_CRAWLER_ID}}
        run: |
          RESPONSE=$(curl -H "Content-Type: application/json" -X GET --user "$CRAWLER_USER_ID:$CRAWLER_API_KEY" \
            "https://crawler.algolia.com/api/1/crawlers/$CRAWLER_ID" | grep "\"blocked\":true" || true ); \
          if [ ! -z "$RESPONSE" ]; then echo "Please go to https://crawler.algolia.com/" && exit 1; fi
      - name: Trigger Algolia reindexing
        # Only reindex after a deployment.
        if: ${{ inputs.deploy }}
        env:
          CRAWLER_USER_ID: ${{secrets.ALGOLIA_CRAWLER_USER_ID}}
          CRAWLER_API_KEY: ${{secrets.ALGOLIA_CRAWLER_API_KEY}}
          CRAWLER_ID: ${{secrets.ALGOLIA_CRAWLER_ID}}
        run: |
          curl -H "Content-Type: application/json" -X POST --user "$CRAWLER_USER_ID:$CRAWLER_API_KEY" \
            "https://crawler.algolia.com/api/1/crawlers/$CRAWLER_ID/reindex"
